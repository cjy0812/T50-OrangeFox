name: OrangeFox R12.1 构建 (T50)

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: "OrangeFox 分支 (12.1 / 14.1)"
        required: true
        default: "12.1"

      DEVICE_TREE_URL:
        description: "设备树 URL"
        required: true
        default: "https://github.com/cjy0812/T50_OrangeFox_Device_Tree"

      DEVICE_TREE_BRANCH:
        description: "设备树分支"
        required: true
        default: "main"

      DEVICE_PATH:
        description: "设备路径"
        required: true
        default: "device/alps/tb8786p1_64_k510_wifi"

      COMMON_TREE_URL:
        description: "通用树 URL (如无通用树，请留空)"
        required: false

      COMMON_PATH:
        description: "通用树路径 (如无通用树，请留空)"
        required: false

      DEVICE_NAME:
        description: "设备名称"
        required: true
        default: "tb8786p1_64_k510_wifi"

      MAKEFILE_NAME:
        description: "Makefile 名称 (twrp_<codename>)"
        required: true
        default: "twrp_tb8786p1_64_k510_wifi"

      BUILD_TARGET:
        description: "构建目标 (bootimage/recoveryimage/vendorbootimage)"
        required: true
        default: "vendorbootimage"

      ENABLE_SSH:
        description: "是否开启 SSH 调试"
        required: true
        default: "false"

      BUILD_MODE:
        description: "构建模式 (debug: 产物放artifacts / release: 可刷入镜像上传Release)"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release

  schedule:
    - cron: "0 4 */14 * *"

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 判断构建模式 (schedule 默认 release)
        id: detect-mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=release" >> $GITHUB_OUTPUT
            echo "::notice::Schedule trigger: using release mode"
          else
            echo "mode=${{ github.event.inputs.BUILD_MODE }}" >> $GITHUB_OUTPUT
            echo "::notice::Manual trigger: mode=${{ github.event.inputs.BUILD_MODE }}"
          fi

      - name: 显示运行参数
        run: |
          echo "::group::用户环境变量"
          echo "触发方式: ${{ github.event_name }}"
          echo "OrangeFox 分支: ${{ github.event.inputs.FOX_BRANCH }}"
          echo "设备树 URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
          echo "设备树分支: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "设备路径: ${{ github.event.inputs.DEVICE_PATH }}"
          echo "设备名称: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Makefile 名称: ${{ github.event.inputs.MAKEFILE_NAME }}"
          echo "构建目标: ${{ github.event.inputs.BUILD_TARGET }}"
          echo "构建模式: ${{ steps.detect-mode.outputs.mode }}"
          echo "::endgroup::"

      - name: 清理磁盘空间
        run: |
          echo "::group::清理前磁盘状态"
          df -h /
          echo "::endgroup::"

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /opt/hostedtoolcache

          echo "::group::清理后磁盘状态"
          df -h /
          echo "::endgroup::"

      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: 准备缓存键
        id: cache-key
        run: |
          mkdir -p ~/.ccache
          echo "week=$(date +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: 准备环境（缓存 apt 包）
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            gperf gcc-multilib gcc-10-multilib
            g++-multilib g++-10-multilib
            libc6-dev lib32ncurses-dev
            x11proto-core-dev libx11-dev tree
            lib32z-dev libgl1-mesa-dev libxml2-utils
            xsltproc bc ccache
            lib32readline-dev lib32z1-dev
            liblz4-tool libncurses-dev
            libsdl1.2-dev build-essential
            libgtk-3-dev libglu1-mesa-dev
            freeglut3-dev git libxml2 lzop
            pngcrush schedtool squashfs-tools
            imagemagick libbz2-dev lzma
            ncftp qemu-user-static
            libstdc++-10-dev libncurses6
            python3 tar
          version: ${{ steps.cache-key.outputs.week }}
          execute_install_scripts: false

      - name: 更新系统包至最新
        run: |
          sudo apt-get purge -yq snapd unattended-upgrades 2>/dev/null || true
          sudo apt update -qq
          HOLD_PKGS=(
            snapd
            cloud-init
            apport
            fwupd
            packagekit
            modemmanager
          )
          HELD=()
          for pkg in "${HOLD_PKGS[@]}"; do
            if sudo apt-mark hold "$pkg" 2>/dev/null; then
              HELD+=("$pkg")
            fi
          done
          UPGRADES=$(apt list --upgradable 2>/dev/null | grep -v '^Listing' | wc -l)
          echo "::notice::升级 $UPGRADES 个包（已 hold ${#HELD[@]} 个无用服务包: ${HELD[*]}）"
          sudo apt upgrade -yq
          if [ ${#HELD[@]} -gt 0 ]; then
            sudo apt-mark unhold "${HELD[@]}"
          fi

      - name: 验证构建工具可用性
        run: |
          if ! command -v ccache &>/dev/null; then
            echo "::warning::ccache not found, reinstalling..."
            sudo apt-get install -yq ccache
          fi
          ccache --version

      - name: 准备环境（动态内核模块）
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r)

      - name: 安装 OpenJDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 11

      - name: 安装 repo
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: 安装浅克隆 git wrapper
        run: |
          WRAPPER_DIR="$HOME/.local/orangefox-ci-bin"
          mkdir -p "$WRAPPER_DIR"

          REAL_GIT="$(which git)"
          echo "REAL_GIT=$REAL_GIT"

          cat > "$WRAPPER_DIR/git" << 'GITEOF'
          #!/bin/bash
          REAL_GIT="__REAL_GIT__"
          if [ "$1" = "clone" ]; then
              HAS_DEPTH=0
              for arg in "$@"; do
                  case "$arg" in
                      --depth|--depth=*) HAS_DEPTH=1; break ;;
                  esac
              done
              if [ "$HAS_DEPTH" = "0" ]; then
                  exec "$REAL_GIT" clone --depth=1 "${@:2}"
              fi
          fi
          exec "$REAL_GIT" "$@"
          GITEOF

          sed -i "s|__REAL_GIT__|$REAL_GIT|" "$WRAPPER_DIR/git"
          chmod +x "$WRAPPER_DIR/git"

          echo "$WRAPPER_DIR" >> $GITHUB_PATH

          echo "git wrapper installed:"
          ls -la "$WRAPPER_DIR/git"

      - name: 初始化工作目录
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
          git config --global user.name "Nico170420"
          git config --global user.email "b170420nc@gmail.com"
        id: pwd

      - name: 同步 OrangeFox 源码
        run: |
          echo "::group::Wrapper 验证"
          echo "repo => $(command -v repo)"
          echo "git  => $(command -v git)"
          echo "::endgroup::"

          FOX_PATH="${{ steps.pwd.outputs.workspace-folder }}"
          mkdir -p ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync

          echo "::group::OrangeFox 同步"
          ./orangefox_sync.sh --branch ${{ github.event.inputs.FOX_BRANCH }} --path "$FOX_PATH"
          echo "::endgroup::"

          echo "::group::磁盘占用统计"
          echo "--- 总目录 ---"
          du -sh "$FOX_PATH" || true
          echo "--- .repo (git objects) ---"
          du -sh "$FOX_PATH/.repo" || true
          echo "--- 工作树 (不含 .repo) ---"
          du -sh --exclude=.repo "$FOX_PATH" || true
          echo "--- .repo 子目录 ---"
          du -sh "$FOX_PATH/.repo/"* 2>/dev/null || true
          echo "::endgroup::"

      - name: 克隆设备树
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          git clone \
            ${{ github.event.inputs.DEVICE_TREE_URL }} \
            -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
            ./${{ github.event.inputs.DEVICE_PATH }}

      - name: 克隆通用树
        if: |
          github.event.inputs.COMMON_TREE_URL != '' &&
          github.event.inputs.COMMON_PATH != ''
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          git clone \
            ${{ github.event.inputs.COMMON_TREE_URL }} \
            -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
            ./${{ github.event.inputs.COMMON_PATH }}

      - name: 同步设备依赖
        run: |
          echo "repo => $(command -v repo)"
          cd ${{ steps.pwd.outputs.workspace-folder }}
          DEP_FILE="${{ github.event.inputs.DEVICE_PATH }}/twrp.dependencies"
          if [ -f "$DEP_FILE" ]; then
            echo "Found $DEP_FILE"
            bash ${GITHUB_WORKSPACE}/scripts/convert.sh "$DEP_FILE"
            repo sync -j$(nproc --all)
          else
            echo "No dependency file, skip."
          fi

      - name: 设置交换空间
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: 恢复 ccache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-fox-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.FOX_BRANCH }}-${{ steps.cache-key.outputs.week }}
          restore-keys: |
            ccache-fox-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.FOX_BRANCH }}-

      - name: Debug SSH
        if: ${{ github.event.inputs.ENABLE_SSH == 'true' }}
        uses: mxschmitt/action-tmate@v3

      - name: 构建 OrangeFox recovery
        run: |
          set +e
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR=~/.ccache
          export LC_ALL=C
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=${{ github.event.inputs.DEVICE_NAME }}
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          ccache -M 5G
          ccache -s

          source build/envsetup.sh 2>&1 || true
          type -t lunch >/dev/null 2>&1 || { echo "FATAL: envsetup.sh did not define 'lunch' — setup truly failed"; exit 1; }
          echo "OK: envsetup.sh completed (exit code ignored per OrangeFox bug workaround)"

          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng || { echo "ERROR: lunch failed"; exit 1; }

          echo "===== BUILD VAR ====="
          get_build_var PRODUCT_OUT
          get_build_var BOARD_USES_RECOVERY_AS_BOOT || true
          get_build_var BOARD_USES_VENDOR_BOOT || true
          get_build_var BOARD_BOOT_HEADER_VERSION
          get_build_var BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE
          get_build_var BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT
          get_build_var BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT
          get_build_var TARGET_NO_KERNEL || true
          get_build_var FOX_VENDOR_BOOT_RECOVERY || true
          get_build_var INSTALLED_VENDOR_BOOTIMAGE_TARGET || true
          echo "===================="

          mka adbd ${{ github.event.inputs.BUILD_TARGET }} \
            -j$(nproc --all)
          BUILD_EXIT=$?

          echo
          echo "========== OUTPUT =========="
          find out/target/product/${{ github.event.inputs.DEVICE_NAME }} -maxdepth 1 -type f || true
          ls -lh out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img || true
          ls -lh out/target/product/${{ github.event.inputs.DEVICE_NAME }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.gz || true
          echo "============================"

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "ERROR: mka exited with code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi

          IMG_COUNT=$(ls out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img 2>/dev/null | wc -l)
          if [ "$IMG_COUNT" -eq 0 ]; then
            echo "ERROR: No .img files produced — build likely failed silently"
            exit 1
          fi

          echo "SUCCESS: $IMG_COUNT image(s) produced"

          DEVICE_OUT="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          FOX_IMG=$(ls "$DEVICE_OUT"/OrangeFox-*.img 2>/dev/null | head -1)
          if [ -n "$FOX_IMG" ] && [ -f "$DEVICE_OUT/vendor_boot.img" ]; then
            rm "$FOX_IMG"
            echo "Removed duplicate $(basename "$FOX_IMG") (identical to vendor_boot.img)"
          fi

        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Bump version (release模式)
        if: steps.detect-mode.outputs.mode == 'release'
        id: tag_version
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_PREFIX: "v"
          DEFAULT_BUMP: "patch"
          INITIAL_VERSION: "1.0.0"
          RELEASE_BRANCHES: "master,main"

      - name: 生成发布名称与整理产物
        id: release-info
        run: |
          BRANCH="${{ github.event.inputs.FOX_BRANCH }}"
          DEVICE="${{ github.event.inputs.DEVICE_NAME }}"
          MODE="${{ steps.detect-mode.outputs.mode }}"
          SHORT_HASH=$(git rev-parse --short=7 HEAD)

          if [ "$MODE" = "release" ]; then
            TAG="${{ steps.tag_version.outputs.new_tag }}"
            PART="${{ steps.tag_version.outputs.part }}"
            echo "::notice::Version bumped: $PART → $TAG"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            TAG="${LATEST_TAG}-${SHORT_HASH}"
            echo "::notice::Debug mode: based on $LATEST_TAG"
          fi

          NAME="OrangeFox_R${BRANCH}_${DEVICE}_${TAG}"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "short_hash=$SHORT_HASH" >> $GITHUB_OUTPUT

          echo "::notice::Final tag: $TAG"
          echo "::notice::Release name: $NAME"

          DEVICE_OUT="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          STAGING="/tmp/upload-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/obj/PACKAGING/vendor_ramdisk_fragments_intermediates"

          if [ "$MODE" = "release" ]; then
            VER_TAG="${TAG}-${SHORT_HASH}"
          else
            VER_TAG="$TAG"
          fi

          cp "$DEVICE_OUT"/vendor_boot.img "$STAGING/vendor_boot_${VER_TAG}.img" 2>/dev/null || true
          cp "$DEVICE_OUT"/ramdisk.img "$STAGING/" 2>/dev/null || true
          cp "$DEVICE_OUT"/OrangeFox-*.zip "$STAGING/" 2>/dev/null || true
          cp "$DEVICE_OUT"/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.gz \
             "$STAGING/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/" 2>/dev/null || true

          echo "=== Staged files ==="
          ls -lhR "$STAGING"
          echo "===================="
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: 保存 ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: 上传到 Release (两个img)
        if: steps.detect-mode.outputs.mode == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            /tmp/upload-staging/vendor_boot_*.img
            /tmp/upload-staging/ramdisk.img
          fail_on_unmatched_files: false
          overwrite_files: true
          name: ${{ steps.release-info.outputs.name }}
          tag_name: ${{ steps.release-info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            OrangeFox Branch: ${{ github.event.inputs.FOX_BRANCH }}
            Device: ${{ github.event.inputs.DEVICE_NAME }}
            Build Target: ${{ github.event.inputs.BUILD_TARGET }}
            Version: ${{ steps.release-info.outputs.tag }}

            Flash Commands:
            - `fastboot flash vendor_boot vendor_boot_*.img` (主镜像, 必刷)
            - `fastboot flash ramdisk ramdisk.img` (备用, 可选)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传辅助产物到 Artifacts (release模式)
        if: steps.detect-mode.outputs.mode == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: release-aux-${{ steps.release-info.outputs.tag }}
          path: |
            /tmp/upload-staging/OrangeFox-*.zip
            /tmp/upload-staging/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.gz
          retention-days: 90
          compression-level: 9

      - name: 上传全部产物到 Artifacts (debug模式)
        if: steps.detect-mode.outputs.mode == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: debug-build-${{ steps.release-info.outputs.tag }}
          path: |
            /tmp/upload-staging/vendor_boot_*.img
            /tmp/upload-staging/ramdisk.img
            /tmp/upload-staging/OrangeFox-*.zip
            /tmp/upload-staging/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.gz
          retention-days: 14
          compression-level: 9
